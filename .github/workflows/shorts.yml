
name: Hindi Jokes Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: write

jobs:
  generate-joke:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Hindi joke
        run: python agent.py

      - name: Generate cartoon scenes
        run: python cartoon.py

      - name: Save cartoon scenes
        uses: actions/upload-artifact@v4
        with:
          name: hindi-cartoon-scenes
          path: scenes/
          retention-days: 7

      - name: Save generated jokes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git diff --cached --quiet || git commit -m "Add generated Hindi joke"
          git push
