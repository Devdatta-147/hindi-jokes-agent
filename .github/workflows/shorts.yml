
name: Hindi Jokes Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: write

jobs:
  generate-joke:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Generate Hindi joke
        run: python agent.py

      - name: Generate cartoon scenes
        run: python cartoon.py

      - name: Generate character assets
        run: python characters.py

      - name: Generate Hindi voice and subtitles
        run: python voice.py

      - name: Create cartoon video
        run: python video.py

      - name: Save video and scenes
        uses: actions/upload-artifact@v4
        with:
          name: hindi-cartoon-video
          path: |
            video/
            scenes/
            characters/
          retention-days: 7

      - name: Save generated jokes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git diff --cached --quiet || git commit -m "Add generated Hindi joke"
          git push
