
name: Hindi Jokes Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

jobs:
  generate-joke:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Hindi Jokes Agent
        run: python agent.py
